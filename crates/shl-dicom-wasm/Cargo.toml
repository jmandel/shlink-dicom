[package]
name = "shl-dicom-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shl-dicom-core = { path = "../shl-dicom-core" }
# is_uncompressed_image only; the linker drops the encoders.
shl-dicom-transcode = { path = "../../codecs/shl-dicom-transcode" }
wasm-bindgen = "=0.2.128"
serde_json = "1.0"
