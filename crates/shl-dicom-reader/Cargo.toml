[package]
name = "shl-dicom-reader"
version = "0.1.0"
edition = "2021"
description = "The viewer's link reader as a small wasm module: SMART Health Link parsing, the manifest's Bundle location, Bundle JWE decryption and the study index, from shl-dicom-core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shl-dicom-core = { path = "../shl-dicom-core" }
shl-dicom-decode = { path = "../../codecs/shl-dicom-decode", default-features = false }
serde_json = "1.0"
wasm-bindgen = "=0.2.128"

[dev-dependencies]
sha2 = "0.10"
