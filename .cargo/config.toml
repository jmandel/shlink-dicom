# Native builds use Rust's default target for the host: baseline x86-64 or aarch64, so binaries run
# on any machine of that architecture (Linux and macOS, Intel, AMD and Apple Silicon). The only CPU
# feature the code uses beyond that, AVX2 in shl-codec-jpeg, is detected at run time.
#
# Opt-in for x86_64 machines with AVX2 (Intel Haswell, AMD Excavator or newer), which the codecs'
# benchmarks use (codecs/README.md, "CPU targets"): build with
#   CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release …
# That variable applies only to native x86_64 Linux builds, never to wasm32.
