# Builds the GitHub Pages site (pages/build.ts): the viewer and the demo SMART Health Link, packed
# from my-health-data at the commit pinned in pages/demo-link.json with the keys recorded there.
# The build fails if the input or the packed files differ from the recorded hashes.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Toolchain, wasm modules and web app: shared with the release workflows (.github/actions/).
      # The packer is native x86-64-v3 code (.cargo/config.toml).
      - uses: ./.github/actions/toolchain
        with:
          cache-key: pages
          native: "true"
      - uses: ./.github/actions/wasm
      - uses: ./.github/actions/web

      - uses: actions/cache@v6
        with:
          path: dist/pages-sources
          key: pages-sources-${{ hashFiles('pages/demo-link.json') }}
          restore-keys: pages-sources-

      - name: Packer
        run: cargo build -q --release -p shl-dicom-server

      - name: Site and demo link
        run: bun pages/build.ts

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
