# Builds the GitHub Pages site (pages/build.ts): the viewer and the demo SMART Health Link, packed
# from my-health-data at the commit pinned in pages/demo-link.json with the keys recorded there.
# The build fails if the input or the packed files differ from the recorded hashes.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.3"
  WASM_BINDGEN_VERSION: "0.2.128"
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Native builds target x86-64-v3 (.cargo/config.toml); the packer's encoder runs here.
      - name: Check the CPU supports x86-64-v3
        run: |
          for f in avx2 bmi1 bmi2 fma movbe; do
            grep -qw "$f" /proc/cpuinfo || { echo "::error::this runner's CPU lacks $f (x86-64-v3)"; exit 1; }
          done
          grep -m1 "model name" /proc/cpuinfo

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Rust and wasm-bindgen
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          t="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$t.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" --strip-components=1 "$t/wasm-bindgen"
          cargo --version; wasm-bindgen --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            codecs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'codecs/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            codecs/mpeg2-wasm/dist/ffmpeg-*.tar.xz
            dist/pages-sources
          key: inputs-${{ hashFiles('bun.lock', 'codecs/mpeg2-wasm/ffmpeg-source.json', 'pages/demo-link.json') }}
          restore-keys: inputs-

      - name: Wasm modules
        run: |
          cargo build -q --release --target wasm32-unknown-unknown -p shl-dicom-wasm
          wasm-bindgen --target web --out-dir crates/shl-dicom-wasm/pkg target/wasm32-unknown-unknown/release/shl_dicom_wasm.wasm
          (cd codecs && cargo build -q --release --target wasm32-unknown-unknown -p shl-dicom-transcode-wasm)
          wasm-bindgen --target web --out-dir codecs/shl-dicom-transcode-wasm/pkg codecs/target/wasm32-unknown-unknown/release/shl_dicom_transcode_wasm.wasm
          bun viewer-kit/scripts/build.mjs

      - name: Web app
        run: |
          bun install --frozen-lockfile
          bun web/build.ts > /dev/null

      - name: Packer
        run: cargo build -q --release -p shl-dicom-server

      - name: Site and demo link
        run: bun pages/build.ts

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
