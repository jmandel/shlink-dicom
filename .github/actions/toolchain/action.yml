name: Toolchain
description: >
  Bun, Rust with the wasm32 target and wasm-bindgen at the versions the repository pins, with a
  cargo cache. Linux (x86_64, aarch64) and macOS runners.
inputs:
  cache-key:
    description: Prefix for the cargo cache key (one per workflow).
    required: true
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.4.3"

    - name: Rust and wasm-bindgen
      shell: bash
      run: |
        if ! command -v rustup > /dev/null; then
          curl -fsSL https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
        rustup default stable
        v=0.2.128
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) t="wasm-bindgen-$v-x86_64-unknown-linux-musl" ;;
          Linux-aarch64) t="wasm-bindgen-$v-aarch64-unknown-linux-gnu" ;;
          Darwin-arm64) t="wasm-bindgen-$v-aarch64-apple-darwin" ;;
          Darwin-x86_64) t="wasm-bindgen-$v-x86_64-apple-darwin" ;;
        esac
        curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/$t.tar.gz" \
          | tar -xz -C "$HOME/.cargo/bin" --strip-components=1 "$t/wasm-bindgen"
        cargo --version; wasm-bindgen --version; bun --version

    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
          codecs/target
        key: ${{ inputs.cache-key }}-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'codecs/Cargo.lock', '.cargo/config.toml') }}
        restore-keys: ${{ inputs.cache-key }}-cargo-${{ runner.os }}-${{ runner.arch }}-
