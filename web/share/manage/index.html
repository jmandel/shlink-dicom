<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>Your share</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f5fbf'/><path d='M9 9h14v14H9z' fill='none' stroke='white' stroke-width='2.5'/><circle cx='16' cy='16' r='3.5' fill='white'/></svg>" />
  <link rel="stylesheet" href="../../assets/base.css" />
  <link rel="stylesheet" href="../../assets/share.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../../">Imaging links</a>
    <a class="btn btn-ghost" href="../../share">Share imaging</a>
  </header>
  <main class="mg" id="mg">
    <p class="muted" id="mg-loading">Opening your share…</p>
  </main>
  <dialog id="confirm">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn btn-danger" value="ok" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>
  <dialog id="rename-link" aria-labelledby="rename-title">
    <form id="rename-form" class="stack">
      <h2 id="rename-title">Edit link label</h2>
      <div class="field">
        <label for="rename-name">Link label (optional)</label>
        <input id="rename-name" type="text" maxlength="80" autocomplete="off" aria-describedby="rename-hint" />
        <p class="hint" id="rename-hint">Shown to you and anyone with the shared link. Leave blank to use “Shared imaging”.</p>
      </div>
      <p class="hint">New copies use this label. Links already sent keep their original label.</p>
      <p class="error hidden" id="rename-error" role="alert"></p>
      <div class="actions">
        <button class="btn" type="button" id="rename-cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" id="rename-save">Save label</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="../../assets/manage.js"></script>
</body>
</html>
