[package]
name = "shl-dicom-transcode-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "shl_dicom_transcode::transcode_part10 for the browser (wasm-bindgen, --target web)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shl-dicom-transcode = { path = "../shl-dicom-transcode" }
shl-codec-jpeg2000-encode = { path = "../shl-codec-jpeg2000-encode" }
wasm-bindgen = "=0.2.128"

[features]
# Exports `encode_only_j2k` for test/bench-chromium.mjs's encoder-only timing. Not in shipped builds.
bench = ["shl-dicom-transcode/bench"]
