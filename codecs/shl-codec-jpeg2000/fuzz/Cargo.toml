[package]
name = "shl-codec-jpeg2000-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shl-codec-jpeg2000 = { path = ".." }
shl-codec-common = { path = "../../shl-codec-common" }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

# Not part of the codecs workspace.
[workspace]
members = ["."]

[[bin]]
name = "decode_scaled"
path = "fuzz_targets/decode_scaled.rs"
test = false
doc = false
bench = false
