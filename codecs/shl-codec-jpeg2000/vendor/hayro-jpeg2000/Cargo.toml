# Vendored copy of hayro-jpeg2000 0.4.1 (MIT OR Apache-2.0, https://github.com/LaurenzV/hayro),
# patched for DICOM use. The patches are listed in ../README.md.
[package]
edition = "2024"
rust-version = "1.92"
name = "hayro-jpeg2000"
version = "0.4.1+shl.1"
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
description = "A memory-safe, pure-Rust JPEG 2000 decoder (vendored, patched)."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/LaurenzV/hayro"
publish = false

[lib]
name = "hayro_jpeg2000"
path = "src/lib.rs"

[features]
default = ["std", "simd"]
logging = ["dep:log"]
simd = ["fearless_simd", "std"]
std = []

[dependencies]
fearless_simd = { version = "1.0.0", optional = true }
log = { version = "0.4", optional = true }
