[package]
name = "shl-codec-jpegxl-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shl-codec-jpegxl = { path = ".." }
shl-codec-common = { path = "../../shl-codec-common" }
jxl-oxide = { version = "0.12.6", default-features = false }

# Separate workspace so the codecs workspace never builds this (it needs nightly + libFuzzer).
[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false
